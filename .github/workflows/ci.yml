name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Audit · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, gd, fileinfo, openssl
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer audit
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
